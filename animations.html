<script>
// Scroll-reveal + navbar shadow. Content stays visible if this script never runs.
document.addEventListener("DOMContentLoaded", function () {
  var nav = document.querySelector(".navbar");
  var onScroll = function () { if (nav) nav.classList.toggle("scrolled", window.scrollY > 10); };
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;

  var targets = document.querySelectorAll(
    "main .work-card, main .now-item, main h2, main h3:not(.work-card h3), main p:not(.work-card p):not(.now-item p), main ul, main ol, main figure, main .columns, main iframe, main .btn"
  );
  document.documentElement.classList.add("reveal-ready");
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.08 });

  targets.forEach(function (el, i) {
    if (el.closest(".hero")) return;            // hero has its own entrance animation
    el.classList.add("reveal");
    // stagger cards in the same grid
    if (el.classList.contains("work-card") || el.classList.contains("now-item")) {
      var idx = Array.prototype.indexOf.call(el.parentNode.children, el);
      el.style.transitionDelay = (idx * 0.08) + "s";
    }
    io.observe(el);
  });
});
</script>
